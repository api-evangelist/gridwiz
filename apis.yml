aid: gridwiz
name: Gridwiz
description: >-
  Gridwiz Inc. is a South Korean clean-energy software and hardware company founded in 2013
  and headquartered in Seoul. It operates one of Korea's largest demand response (DR)
  aggregation portfolios, gathering electricity that industrial and commercial customers
  curtail and selling it into the national power market, and it pairs that with energy
  storage (ESS), renewable energy / RE100 and PPA advisory, and an e-mobility line covering
  EV charging controllers, CCS communication modems (EVCC/SECC), bidirectional V2G chargers
  and the Skyblue consumer charging service. Its e-mobility products are built to the
  international EV charging standards DIN SPEC 70121, ISO 15118 (including 15118-20 AC/DC)
  and OCPP, and its demand response management system is described as OpenADR-based. Gridwiz
  sells energy services and certified hardware to utilities, EVSE suppliers and enterprises;
  it publishes no public developer program, API reference, or machine-readable API contract.
